name: ponte_remota
description: Estenda — o PC no tablet (espelhamento e segundo monitor), em casa e de longe.
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.3
  webview_flutter: ^4.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/web/   # a tela remota (copiada de ../interface pelo preparar_android.ps1)
