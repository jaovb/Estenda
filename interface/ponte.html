<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Estenda · ponte de longe</title>
</head>
<body>
<p>Ponte de longe do Estenda. Esta página roda sem janela e é controlada pelo app.</p>
<script src="/base.js"></script>
<script>
"use strict";
/* Liga o tablet (de longe) ao servidor deste PC:
     tablet ⇄ WebRTC direto ⇄ esta página ⇄ ws://127.0.0.1/ws-ponte ⇄ servidor local
   Os pontos de encontro (base.js) só servem para os dois trocarem a oferta e a resposta, cifradas. */
const TOKEN = new URLSearchParams(location.search).get("t") || "";
let cfg = null, encontro = null, sinalEstado = "desligado", erro = "", semLinha = 0;
const D = { ofertas: 0, respostas: 0, ice: [] };  // diagnóstico
const pares = new Map();  // id do tablet no encontro -> par
const MAX_PARES = 12;

async function api(caminho, corpo) {
  const op = { headers: { "X-Token": TOKEN } };
  if (corpo) { op.method = "POST"; op.headers["Content-Type"] = "application/json"; op.body = JSON.stringify(corpo); }
  const r = await fetch(caminho, op);
  if (!r.ok) throw new Error("app " + r.status);
  return r.json();
}
function contar() {
  api("/api/ponte/estado", {
    sinal: sinalEstado, erro, encontros: encontro ? encontro.conectados : 0,
    diag: { ...(encontro ? encontro.diag : {}), ofertas: D.ofertas, respostas: D.respostas, ice: D.ice.slice(-6) },
    pares: [...pares.values()].filter(p => p.local && p.local.readyState === 1).length,
  }).catch(() => {});
}
setInterval(contar, 4000);
function mudar(estado, texto) { if (estado !== sinalEstado || (texto || "") !== erro) { sinalEstado = estado; erro = texto || ""; contar(); } }

/* ---------------------------------------------------------------- um tablet */
function fecharPar(id) {
  const p = pares.get(id);
  if (!p) return;
  pares.delete(id);
  clearTimeout(p.limite);
  try { p.dc && p.dc.close(); } catch (_) {}
  try { p.pc.close(); } catch (_) {}
  try { p.local && p.local.close(); } catch (_) {}
  contar();
}
async function ipDoTablet(pc) {
  try {
    const st = await pc.getStats();
    let par = null;
    st.forEach(r => { if (r.type === "transport" && r.selectedCandidatePairId) par = st.get(r.selectedCandidatePairId); });
    if (!par) st.forEach(r => { if (r.type === "candidate-pair" && r.nominated && r.state === "succeeded") par = r; });
    const rem = par && st.get(par.remoteCandidateId);
    return rem ? (rem.address || rem.ip || "de longe") + (rem.candidateType === "relay" ? " (retransmitido)" : "") : "de longe";
  } catch (_) { return "de longe"; }
}
async function oferta(m) {
  const id = m.de;
  const velho = pares.get(id);
  if (velho) {  // o tablet repete a oferta até ouvir a resposta: reenvia a mesma, sem recomeçar
    if (velho.n === m.n) { if (velho.resposta) encontro.enviar(velho.resposta, id); return; }
    fecharPar(id);
  }
  if (pares.size >= MAX_PARES) return;
  D.ofertas++;
  const pc = new RTCPeerConnection({ iceServers: Base.ICE });
  pc.oniceconnectionstatechange = () => { D.ice.push(pc.iceConnectionState); contar(); };
  const par = { pc, n: m.n, dc: null, local: null, fila: [], partes: [], ice: [], remoto: false, resposta: null };
  pares.set(id, par);
  par.limite = setTimeout(() => { if (!par.local) fecharPar(id); }, 55000);
  pc.onconnectionstatechange = () => { if (["failed", "closed"].includes(pc.connectionState) && pares.get(id) === par) fecharPar(id); };
  pc.ondatachannel = e => {
    const dc = par.dc = e.channel;
    dc.binaryType = "arraybuffer";
    dc.onmessage = ev => {
      const msg = Base.juntarPartes(par.partes, ev.data);
      if (msg === null) return;
      if (par.local && par.local.readyState === 1) par.local.send(msg); else par.fila.push(msg);
    };
    dc.onclose = () => { if (pares.get(id) === par) fecharPar(id); };
    const abrir = async () => {
      // o vínculo prova ao servidor que a senha foi usada NESTE canal (e não num canal trocado no meio)
      const v = "p2p|" + Base.impressao(pc.localDescription.sdp) + "|" + Base.impressao(pc.remoteDescription.sdp);
      const ip = await ipDoTablet(pc);
      const ws = par.local = new WebSocket(`ws://127.0.0.1:${cfg.porta}/ws-ponte?t=${encodeURIComponent(cfg.token)}&v=${encodeURIComponent(v)}&ip=${encodeURIComponent(ip)}`);
      ws.binaryType = "arraybuffer";
      ws.onopen = () => { clearTimeout(par.limite); for (const x of par.fila.splice(0)) ws.send(x); contar(); };
      ws.onmessage = ev => { if (dc.readyState === "open") Base.enviarPartes(dc, ev.data); };
      ws.onclose = () => { if (pares.get(id) === par) fecharPar(id); };
    };
    if (dc.readyState === "open") abrir(); else dc.onopen = abrir;
  };
  try {
    await pc.setRemoteDescription({ type: "offer", sdp: m.sdp });
    par.remoto = true;
    for (const c of par.ice.splice(0)) pc.addIceCandidate(c).catch(() => {});
    await pc.setLocalDescription(await pc.createAnswer());
    const sdp = await Base.sdpCompleto(pc, 2000);
    if (pares.get(id) !== par) return;
    par.resposta = { t: "resposta", n: m.n, sdp };
    encontro.enviar(par.resposta, id);
    D.respostas++;
    // endereços achados depois da resposta ainda são aproveitados
    pc.onicecandidate = e => { if (e.candidate && encontro) encontro.enviar({ t: "ice", n: m.n, c: e.candidate.toJSON() }, id); };
  } catch (e) {
    fecharPar(id);
  }
}
function recado(m) {
  if (!m || typeof m.de !== "string" || m.de === "pc") return;
  if (m.t === "oferta" && typeof m.sdp === "string") oferta(m);
  else if (m.t === "ice" && m.c) {
    const p = pares.get(m.de);
    if (p && p.n === m.n) p.remoto ? p.pc.addIceCandidate(m.c).catch(() => {}) : p.ice.push(m.c);
  } else if (m.t === "fim") { const p = pares.get(m.de); if (p && !p.local) fecharPar(m.de); }
}

/* ---------------------------------------------------------------- pontos de encontro */
function ligarEncontro() {
  if (!cfg || !cfg.ativo || encontro) return;
  mudar("conectando");
  semLinha = Date.now();
  encontro = new Base.Encontro({
    segredo: cfg.segredo, urls: cfg.encontros, papel: "pc", aoMensagem: recado,
    aoEstado: n => {
      if (n > 0) { semLinha = 0; mudar("pronto"); }
      else { if (!semLinha) semLinha = Date.now(); mudar("conectando"); }
    },
  });
}
setInterval(() => {  // nenhum ponto de encontro respondendo há um tempo: avisa (e continua tentando)
  if (encontro && semLinha && Date.now() - semLinha > 15000)
    mudar("erro", "Sem contato com os pontos de encontro. Confira a internet deste PC.");
}, 3000);
function fecharTudo() {
  if (encontro) { encontro.fechar(); encontro = null; }
  for (const id of [...pares.keys()]) fecharPar(id);
}

async function vigiar() {
  try {
    const novo = await api("/api/ponte");
    const mudou = !cfg || novo.segredo !== cfg.segredo || novo.porta !== cfg.porta || novo.ativo !== cfg.ativo
      || JSON.stringify(novo.encontros) !== JSON.stringify(cfg.encontros);
    cfg = novo;
    if (mudou) { fecharTudo(); if (cfg.ativo) ligarEncontro(); else mudar("desligado"); }
  } catch (_) {
    fecharTudo();  // o app fechou
  }
  setTimeout(vigiar, 2000);
}
vigiar();
</script>
</body>
</html>
