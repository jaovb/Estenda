# Compila o app NATIVO do tablet (Android) aqui no GitHub, sem instalar nada no PC.
# Roda sozinho quando a pasta app_tablet muda, ou em Actions -> "App do tablet" -> Run workflow.
# No fim, o Estenda.apk fica em Releases. No tablet, abra:
#   https://github.com/SEU-USUARIO/SEU-REPOSITORIO/releases/latest/download/Estenda.apk
name: App do tablet
on:
  workflow_dispatch:
  push:
    paths: ["app_tablet/**", "interface/icone-512.png", ".github/workflows/app-tablet.yml"]

permissions:
  contents: write   # para publicar o APK em Releases

jobs:
  apk:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Mesma assinatura sempre (o tablet atualiza por cima, sem desinstalar)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:USERPROFILE\.android" | Out-Null
          Copy-Item app_tablet\assinatura\debug.keystore "$env:USERPROFILE\.android\debug.keystore" -Force
      - name: Preparar o projeto Android
        shell: pwsh
        run: ./app_tablet/preparar_android.ps1
      - name: Compilar
        shell: pwsh
        working-directory: app_tablet
        run: |
          flutter pub get
          flutter build apk --release --build-number ${{ github.run_number }}
          Copy-Item build\app\outputs\flutter-apk\app-release.apk ..\Estenda.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Estenda-apk
          path: Estenda.apk
      - name: Publicar em Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tablet-${{ github.run_number }}
          name: App do tablet ${{ github.run_number }}
          body: "Abra no tablet e toque no Estenda.apk para instalar."
          files: Estenda.apk
          make_latest: true
